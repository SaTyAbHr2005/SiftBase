name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # same as render.yaml
          cache: pip
      - run: pip install -r requirements.txt
      # Offline: tests stub every model call and skip the ones marked slow (real models or corpus files).
      - run: python -m pytest -q
